kind: pipeline
type: docker
name: default

steps:
- name: build
  image: harness0.harness.io/oci/docker_artifacts/hhi/go:1.26.10@sha256:718fddf012b3a305e936ae9964e5a642036bcb7b4c6c0786e2f78f238d637db8
  commands:
  - go build
  - go test ./...
  - sh scripts/build.sh

- name: publish
  image: plugins/docker
  settings:
    pull_image: true
    no_cache: true
    repo: plugins/drone-aws-cli
    auto_tag: true
    dockerfile: docker/Dockerfile
    username:
      from_secret: docker_username
    password:
      from_secret: docker_password
---
kind: pipeline
type: vm
name: linux-arm64
platform:
  os: linux
  arch: arm64
pool:
  use: ubuntu_arm64

steps:
  - name: environment
    image: harness0.harness.io/oci/docker_artifacts/hhi/go:1.26.10@sha256:718fddf012b3a305e936ae9964e5a642036bcb7b4c6c0786e2f78f238d637db8
    pull: always
    environment:
      CGO_ENABLED: "0"
    commands:
      - go version
      - go env
  - name: build
    image: harness0.harness.io/oci/docker_artifacts/hhi/go:1.26.10@sha256:718fddf012b3a305e936ae9964e5a642036bcb7b4c6c0786e2f78f238d637db8
    environment:
      CGO_ENABLED: "0"
    commands:
      - go build -v -ldflags "-X main.version=" -a -tags netgo -o release/linux/arm64/plugin .
  - name: docker
    image: plugins/docker
    settings:
      pull_image: true
      no_cache: true
      dockerfile: docker/Dockerfile.linux.arm64
      repo:  plugins/drone-aws-cli
      username:
        from_secret: docker_username
      password:
        from_secret: docker_password
      auto_tag: true
      auto_tag_suffix: linux-arm64
depends_on:
  - default
trigger:
  ref:
    - refs/heads/master
    - refs/tags/**
    - refs/pull/**
---
